<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <title>Coquitlam College Service Check-in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    select, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; box-sizing: border-box; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="form-container">
    <h2>Student Service Check-in</h2>
    <label for="serviceSelect">Please select the service area you are using:</label>
    <select id="serviceSelect">
      <option value="Learning Centre">Learning Centre</option>
      <option value="Counselling">Counselling</option>
      <option value="Workshop">Workshop</option>
      <option value="Clubs">Peer Tutoring</option>
    </select>
    <button id="checkinBtn" onclick="submitCheckin()">Check In</button>
  </div>

  <h2 id="message" class="hidden"></h2>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk_M5DMH90XepLKWT6m9SFihrQYDeHaJwrP1q8s1yK3l-WvH_7iLAK-C9982CeRUW3ZQ/exec";
    const COOLDOWN_MINUTES = 30;

    let deviceId = localStorage.getItem("campus_device_id");
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
      localStorage.setItem("campus_device_id", deviceId);
    }

    function submitCheckin() {
      const lastCheckin = localStorage.getItem("last_checkin_time");
      const now = new Date().getTime();

      if (lastCheckin && (now - lastCheckin < COOLDOWN_MINUTES * 60 * 1000)) {
        document.getElementById("form-container").classList.add("hidden");
        const msg = document.getElementById("message");
        msg.innerText = "You have already checked in recently from this device.";
        msg.classList.remove("hidden");
        return;
      }

      const service = document.getElementById("serviceSelect").value;
      const btn = document.getElementById("checkinBtn");
      btn.disabled = true;
      btn.innerText = "Recording...";

      // Send as POST with no-cors to bypass browser blocking
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ service: service, deviceId: deviceId })
      })
      .then(() => {
        localStorage.setItem("last_checkin_time", now);
        document.getElementById("form-container").classList.add("hidden");
        const msg = document.getElementById("message");
        msg.innerText = "Check-in recorded. Thank you.";
        msg.classList.remove("hidden");
      })
      .catch(error => {
        btn.disabled = false;
        btn.innerText = "Check In";
        alert("Error recording visit. Please try again.");
        console.error(error);
      });
    }
  </script>
</body>
</html>
